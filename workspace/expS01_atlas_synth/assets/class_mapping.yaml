schema_version: 1
reviewed_on: "2026-09-08"
status: "provisional_requires_local_review"
fine_id_policy: "user_list_order_1_to_30_not_verified_official_mask_values"
background_id: null
coarse_mapping: null
station_nomenclature: "要確認"
station_labels: ["6L", "6R", "7L", "7R", "8", "9", "10L", "10R", "11L", "11R", "12L", "12R", "13L", "13R"]
category_definitions:
  a: "既存アトラス形状を直接利用・変換する候補（評価済み形状のQAは別）"
  b: "公開CT付属マスクによる患者変動を優先する候補"
  c: "手続き的な術中状態の生成・既存形状の加工が必要"
  d: "今回確認した版では正確な対応を作れない（全版で不存在という意味ではない）"
matching_policy:
  automatic_assignment_enabled: false
  fma_ids_meaning: "BodyParts3D 4.0公式索引で検証した概念ID。Z-Anatomy内のID保持・部品への結合は未検証"
  name_patterns_usage: "case-insensitive regex fullmatch; 候補抽出と手動crosswalk作成専用"
  z_anatomy_fma_binding: "requires_verified_object_to_fma_sidecar"
  missing: "error_or_ignore_region_never_silently_background"
  multiple_class_matches: "error"
  recursive_ontology_expansion: false
  require_evaluated_nonempty_geometry: true
  require_per_asset_license_and_sha256: true
ct_policy:
  default_mode: "released_public_ct_masks_to_mesh"
  pretrained_weights_enabled: false
  training_data_provenance: "重みごとの全学習データと初期化元が公開と検証できるまで有効化しない"
  dataset_url: "https://zenodo.org/records/10047292"
  dataset_license: "CC-BY-4.0"
  label_namespace: "TotalSegmentator total v2; selected dataset labels must be checked"
